name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Quality and Chromium E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Build static site
        run: npm run build

      - name: Enforce bundle budget
        run: npm run check:bundle

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  browser-smoke:
    name: ${{ matrix.browser }} smoke
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build static site
        run: npm run build

      - name: Run smoke test
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  deployment:
    name: Static container contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker build -t mermaid-styler:ci .
      - run: docker run -d --name mermaid-styler-ci -p 127.0.0.1:8080:80 mermaid-styler:ci
      - name: Verify HTTP contract
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/healthz; then break; fi
            sleep 1
          done
          npm run check:deployment -- http://127.0.0.1:8080
      - name: Verify render and export under HTTP CSP
        run: npx playwright test tests/e2e/cross-browser-smoke.spec.ts --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
      - name: Container logs
        if: failure()
        run: docker logs mermaid-styler-ci
      - name: Cleanup test container
        if: always()
        run: docker rm -f mermaid-styler-ci
